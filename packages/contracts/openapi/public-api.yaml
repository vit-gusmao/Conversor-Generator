openapi: 3.1.0
info:
  title: PDF to Excel Platform API
  version: 1.0.0
  description: |
    API pública da plataforma. Este documento é um resumo executável do
    contrato; a implementação de referência está em `apps/api` (NestJS) e o
    espelho standalone em `services/converter/api`.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Cria usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
  /auth/anonymous:
    post:
      tags: [Auth]
      summary: Sessão anônima de dispositivo
      security: []
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuário atual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /conversions:
    post:
      tags: [Conversions]
      summary: Envia PDF e cria tarefa
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Aceito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateConversionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [Conversions]
      summary: Histórico
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConversionListItem' }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
  /conversions/{id}:
    get:
      tags: [Conversions]
      summary: Status
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
    delete:
      tags: [Conversions]
      summary: Exclui conversão
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '204': { description: Removida }
  /conversions/{id}/events:
    get:
      tags: [Realtime]
      summary: SSE de progresso
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - in: header
          name: Last-Event-ID
          schema: { type: integer }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /conversions/{id}/result:
    get:
      tags: [Conversions]
      summary: Metadados do resultado
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultSummary' }
  /conversions/{id}/preview:
    get:
      tags: [Conversions]
      summary: Prévia paginada
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: query, name: sheet, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preview' }
  /conversions/{id}/download:
    get:
      tags: [Conversions]
      summary: Baixa o XLSX
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '200':
          description: Arquivo XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '409': { $ref: '#/components/responses/Error' }
  /conversions/{id}/retry:
    post:
      tags: [Conversions]
      summary: Cria nova execução
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '202': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /conversions/{id}/cancel:
    post:
      tags: [Conversions]
      summary: Solicita cancelamento
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '202': { $ref: '#/components/responses/Error' }
  /conversions/{id}/audit:
    get:
      tags: [Audit]
      summary: Resumo da auditoria
      parameters: [{ $ref: '#/components/parameters/ConversionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditSummary' }
  /conversions/{id}/audit/events:
    get:
      tags: [Audit]
      summary: Eventos detalhados
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: query, name: stage, schema: { type: string } }
        - { in: query, name: event_type, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: since_sequence, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, maximum: 500, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  total: { type: integer }
  /conversions/{id}/audit/pages/{page}:
    get:
      tags: [Audit]
      summary: Evidências de uma página
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: path, name: page, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageAudit' }
  /conversions/{id}/audit/cells:
    get:
      tags: [Audit]
      summary: Proveniência de células
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: query, name: sheet, schema: { type: string } }
        - { in: query, name: cell, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, maximum: 500, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CellEvidence' } }
                  total: { type: integer }
  /conversions/{id}/audit/issues:
    get:
      tags: [Audit]
      summary: Erros e avisos
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: query, name: severity, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditIssue' } }
                  total: { type: integer }
  /conversions/{id}/audit/export:
    get:
      tags: [Audit]
      summary: Exporta relatório
      parameters:
        - { $ref: '#/components/parameters/ConversionId' }
        - { in: query, name: format, schema: { type: string, enum: [json, txt], default: json } }
      responses:
        '200':
          description: Arquivo
          content:
            application/json:
              schema: { type: object }
  /settings:
    get:
      tags: [System]
      summary: Configurações e capacidades
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
  /health:
    get:
      tags: [System]
      summary: Saúde dos serviços
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  services:
                    type: object
                    additionalProperties: { type: string }

  # -------------------------------------------------------------------------
  # Upgrade plan (docs 02/04/05): sources, imports, schedules, occurrences.
  # Rotas novas; envelope de erro e identidade por sessão já existentes.
  # -------------------------------------------------------------------------

  /source-roots:
    get:
      tags: [Sources]
      summary: Concessões de raiz visíveis ao dono
      description: |
        Lista somente concessões do dono atual. O caminho absoluto nunca é
        exposto a outros donos; a resposta traz rótulo, runtime e disponibilidade.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SourceRoot' }
  /sources:
    get:
      tags: [Sources]
      summary: Lista fontes do dono
      responses:
        '200': { description: OK }
    post:
      tags: [Sources]
      summary: Cria fonte dentro de raiz concedida
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Fonte criada (nenhuma conversão é iniciada ao salvar)
        '400':
          description: |
            UNKNOWN_FIELD: campo desconhecido (ex.: owner_id — a identidade vem
            da sessão). INVALID_SOURCE: caminho relativo inválido.
            INVALID_PAYLOAD: corpo inválido.
          content:
            application/json:
              schema: { $ref: '#/components/responses/Error' }
        '404': { description: Raiz inexistente ou de outro dono }
  /sources/{id}:
    get:
      tags: [Sources]
      summary: Consulta fonte
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200': { description: OK }
        '404': { description: Fonte inexistente ou de outro dono }
    patch:
      tags: [Sources]
      summary: Edita fonte com controle de versão
      description: |
        Edição otimista por `version`: conflito retorna 409 sem sobrescrever
        silenciosamente. Desativação é lógica.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200': { description: Atualizada }
        '409': { $ref: '#/components/responses/RevisionConflict' }
    delete:
      tags: [Sources]
      summary: Arquiva fonte (histórico preservado)
      description: Conflito se houver agenda ativa usando a fonte.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200': { description: Arquivada }
        '409': { $ref: '#/components/responses/Error' }
  /sources/{id}/validate:
    post:
      tags: [Sources]
      summary: Valida acesso e formatos (amostra limitada)
      description: Não inicia conversão. Pasta inexistente/sem acesso é indisponível, não vazia.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200': { description: Relatório de validação com amostra }
  /sources/{id}/imports:
    post:
      tags: [Sources]
      summary: Inicia importação (202)
      description: |
        Exige `Idempotency-Key`. A mesma chave com corpo igual devolve a mesma
        importação; corpo diferente devolve 409 IDEMPOTENCY_KEY_REUSED.
        Captura a definição vigente da fonte em transação (snapshot).
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '202':
          description: Importação aceita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRecord' }
        '409':
          description: IDEMPOTENCY_KEY_REUSED ou raiz revogada
          content:
            application/json:
              schema: { $ref: '#/components/responses/Error' }
  /imports/{id}:
    get:
      tags: [Sources]
      summary: Progresso da importação
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200': { description: OK }
  /imports/{id}/items:
    get:
      tags: [Sources]
      summary: Itens da importação (cursor)
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200': { description: Página com erros por arquivo }
  /imports/{id}/cancel:
    post:
      tags: [Sources]
      summary: Pedido durável de cancelamento (idempotente)
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '202': { description: Aceito }

  /schedules:
    get:
      tags: [Schedules]
      summary: Lista agendas do dono
      responses:
        '200': { description: OK }
    post:
      tags: [Schedules]
      summary: Cria agenda
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
            examples:
              daily:
                value:
                  name: Importação diária
                  source_id: src_1
                  rule: { kind: daily, local_time: '08:00' }
                  timezone: America/Sao_Paulo
                  misfire_policy: run_once_latest
                  overlap_policy: skip
                  options: { target_formats: [xlsx, txt, csv] }
                  index_collection_id: null
              interval:
                value:
                  name: A cada hora
                  source_id: src_1
                  rule: { kind: interval, every_seconds: 3600, anchor_at: '2026-11-19T11:00:00Z' }
                  timezone: UTC
      responses:
        '201': { description: Criada }
        '400':
          description: 'INVALID_SCHEDULE_RULE (ex.: intervalo < 60s ou > 365 dias), INVALID_TIMEZONE, UNKNOWN_FIELD'
          content:
            application/json:
              schema: { $ref: '#/components/responses/Error' }
  /schedules/preview:
    post:
      tags: [Schedules]
      summary: Próximas cinco ocorrências sem executar
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
  /schedules/{id}:
    get:
      tags: [Schedules]
      summary: Consulta agenda
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: OK }
    patch:
      tags: [Schedules]
      summary: Edição otimista por revisão
      description: |
        Editar regra/opções incrementa `revision` e recalcula o futuro a partir
        da edição. Ocorrências já criadas usam o snapshot antigo completo.
        Conflito de revisão → 409 REVISION_CONFLICT, sem sobrescrever.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: Atualizada }
        '409': { $ref: '#/components/responses/RevisionConflict' }
    delete:
      tags: [Schedules]
      summary: Arquiva agenda (pausa e preserva histórico)
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: Arquivada }
  /schedules/{id}/pause:
    post:
      tags: [Schedules]
      summary: Pausa novas ocorrências (idempotente)
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: Pausada }
  /schedules/{id}/resume:
    post:
      tags: [Schedules]
      summary: Retoma do próximo horário futuro (idempotente)
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: Retomada }
  /schedules/{id}/run-now:
    post:
      tags: [Schedules]
      summary: Executa agora (202)
      description: |
        Cria ocorrência manual com chave idempotente própria, sem deslocar o
        próximo disparo do calendário; aplica a mesma política de concorrência.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '202': { description: Ocorrência manual criada }
  /schedules/{id}/runs:
    get:
      tags: [Schedules]
      summary: Histórico de ocorrências (paginado)
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { description: OK }
  /schedule-runs/{id}:
    get:
      tags: [Schedules]
      summary: Detalhe da ocorrência
      parameters:
        - $ref: '#/components/parameters/ScheduleRunId'
      responses:
        '200': { description: OK }
  /schedule-runs/{id}/events:
    get:
      tags: [Schedules]
      summary: Eventos da ocorrência (SSE com Last-Event-ID)
      parameters:
        - $ref: '#/components/parameters/ScheduleRunId'
      responses:
        '200': { description: Fluxo retomável }
  /schedule-runs/{id}/cancel:
    post:
      tags: [Schedules]
      summary: Cancela ocorrência e propaga aos trabalhos filhos
      description: Idempotente; resultado já publicado permanece histórico.
      parameters:
        - $ref: '#/components/parameters/ScheduleRunId'
      responses:
        '202': { description: Aceito }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConversionId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
    AuthSession:
      description: Sessão criada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
    RevisionConflict:
      description: Conflito de revisão/versão (REVISION_CONFLICT) — releia o estado e reaplique
      content:
        application/json:
          schema: { $ref: '#/components/responses/Error' }
  parameters:
    SourceId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ImportId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ScheduleId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ScheduleRunId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin, viewer] }
        is_anonymous: { type: boolean }
        created_at: { type: string, format: date-time }
    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/User' }
    CreateConversionResponse:
      type: object
      properties:
        conversion_id: { type: string, format: uuid }
        status: { type: string }
        message: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
    ConversionListItem:
      type: object
      properties:
        conversion_id: { type: string, format: uuid }
        status: { type: string }
        progress: { type: number }
        quality: { type: string }
        filename: { type: string }
        page_count: { type: integer, nullable: true }
        size_bytes: { type: integer }
        tables: { type: integer, nullable: true }
        cells: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Conversion:
      type: object
      properties:
        conversion_id: { type: string, format: uuid }
        status: { type: string }
        stage: { type: string }
        progress: { type: number }
        progress_indeterminate: { type: boolean }
        quality: { type: string }
        document: { type: object }
        run: { type: object }
        stats: { type: object, nullable: true }
        validation: { type: object, nullable: true }
        error: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        links:
          type: object
          additionalProperties: { type: string }
    ResultSummary:
      type: object
      properties:
        conversion_id: { type: string }
        status: { type: string }
        quality: { type: string }
        pages: { type: integer }
        tables: { type: integer }
        sheets: { type: integer }
        cells: { type: integer }
        records: { type: integer }
        fields: { type: integer }
        download_url: { type: string }
        audit_url: { type: string }
        sheets:
          type: array
          items: { type: object }
        warnings:
          type: array
          items: { type: object }
    Preview:
      type: object
      properties:
        sheet: { type: string }
        headers:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: object }
        total_rows: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    AuditSummary:
      type: object
      properties:
        conversion_id: { type: string }
        run_id: { type: string }
        quality: { type: string }
        status: { type: string }
        metrics: { type: object }
        coverage:
          type: array
          items: { type: object }
        engines:
          type: array
          items: { type: object }
        decisions:
          type: array
          items: { type: object }
        validations:
          type: array
          items: { type: object }
        timings:
          type: array
          items: { type: object }
        hash_chain_valid: { type: boolean }
        generated_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      properties:
        event_id: { type: string }
        run_id: { type: string }
        sequence: { type: integer }
        event_type: { type: string }
        stage: { type: string }
        severity: { type: string }
        page_number: { type: integer, nullable: true }
        region_id: { type: string, nullable: true }
        extraction_method: { type: string, nullable: true }
        message: { type: string }
        payload: { type: object }
        previous_hash: { type: string, nullable: true }
        event_hash: { type: string }
        created_at: { type: string, format: date-time }
    AuditIssue:
      type: object
      properties:
        issue_id: { type: string }
        run_id: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        code: { type: string }
        message: { type: string }
        page_number: { type: integer, nullable: true }
        region_id: { type: string, nullable: true }
        context: { type: object }
        created_at: { type: string, format: date-time }
    PageAudit:
      type: object
      properties:
        page_number: { type: integer }
        classification: { type: string }
        status: { type: string }
        regions:
          type: array
          items: { type: object }
        blocks:
          type: array
          items: { type: object }
        tables_detail:
          type: array
          items: { type: object }
        issues:
          type: array
          items: { $ref: '#/components/schemas/AuditIssue' }
    CellEvidence:
      type: object
      properties:
        sheet: { type: string }
        cell: { type: string }
        row: { type: integer }
        column: { type: integer }
        header: { type: string }
        value: { type: string, nullable: true }
        original_value: { type: string, nullable: true }
        value_type: { type: string }
        source: { type: object, nullable: true }
        transformations:
          type: array
          items: { type: object }
        record_id: { type: string, nullable: true }
        field_label: { type: string, nullable: true }
        table_id: { type: string, nullable: true }
        validation: { type: object }
    PlatformSettings:
      type: object
      properties:
        auth_mode: { type: string, enum: [optional, required] }
        max_upload_bytes: { type: integer }
        max_pages: { type: integer }
        runtime_mode: { type: string, enum: [standalone, full] }
        ocr_enabled: { type: boolean }
        ocr_engine: { type: string, nullable: true }
        storage_backend: { type: string, enum: [local, s3] }
        retention: { type: object }
        engine_version: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
    # ------------------------------------------------------------------
    # Upgrade plan (T1): fontes, agendas e ocorrências
    # ------------------------------------------------------------------
    SourceRoot:
      type: object
      required: [id, runtime_id, runtime_available, granted_by, created_at]
      properties:
        id: { type: string }
        label: { type: string, nullable: true }
        runtime_id: { type: string }
        runtime_available: { type: boolean }
        granted_by: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    SourceCreate:
      type: object
      required: [root_id, relative_path, kind, name]
      additionalProperties: false
      properties:
        root_id: { type: string }
        relative_path: { type: string, minLength: 1 }
        kind: { type: string, enum: [file, directory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        recursive: { type: boolean, default: false }
        include_patterns:
          type: array
          items: { type: string }
          nullable: true
        exclude_patterns:
          type: array
          items: { type: string }
          nullable: true
    ImportRecord:
      type: object
      required: [id, source_id, status]
      properties:
        id: { type: string }
        owner_id: { type: string }
        source_id: { type: string }
        source_version: { type: integer }
        status:
          type: string
          enum: [pending, scanning, submitting, converting, indexing, completed, partial, failed, cancelled]
        definition: { type: object }
        batch_id: { type: string, nullable: true }
        counts:
          type: object
          properties:
            total: { type: integer }
            imported: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScheduleRule:
      oneOf:
        - type: object
          required: [kind, local_time]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [daily] }
            local_time: { type: string, pattern: '^([01]\d|2[0-3]):([0-5]\d)$' }
        - type: object
          required: [kind, every_seconds]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [interval] }
            every_seconds: { type: integer, minimum: 60, maximum: 31536000 }
            anchor_at: { type: string, format: date-time, nullable: true }
    ScheduleCreate:
      type: object
      required: [name, source_id, rule, timezone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        source_id: { type: string }
        rule: { $ref: '#/components/schemas/ScheduleRule' }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        misfire_policy: { type: string, enum: [run_once_latest, skip], default: run_once_latest }
        overlap_policy: { type: string, enum: [skip, queue_one], default: skip }
        options: { type: object, nullable: true }
        index_collection_id: { type: string, nullable: true }
    ScheduleRecord:
      allOf:
        - $ref: '#/components/schemas/ScheduleCreate'
        - type: object
          required: [id, owner_id, revision]
          properties:
            id: { type: string }
            owner_id: { type: string }
            enabled: { type: boolean }
            archived: { type: boolean }
            revision: { type: integer, minimum: 1 }
            next_run_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AutomationRun:
      type: object
      required: [id, schedule_id, scheduled_for, trigger, occurrence_key, state]
      properties:
        id: { type: string }
        owner_id: { type: string }
        schedule_id: { type: string }
        schedule_revision: { type: integer }
        scheduled_for: { type: string, format: date-time }
        trigger: { type: string, enum: [schedule, manual, recovery] }
        occurrence_key: { type: string }
        state:
          type: string
          enum: [queued, running, waiting_children, cancelling, succeeded, partial, no_changes, failed, cancelled, skipped]
        phase: { type: string, enum: [scan, snapshot, submit, convert, index, finalize], nullable: true }
        import_id: { type: string, nullable: true }
        index_job_id: { type: string, nullable: true }
        attempt: { type: integer }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversionOptions:
      description: |
        v2 (legado, PDF/imagem) ou v3 (entrada de planilha). v3 acrescenta a
        seção `spreadsheet` { sheet_names, header_row, csv_encoding,
        csv_delimiter, formula_mode, reader_version }; `reader_version` é
        estampado pelo servidor e participa do fingerprint de idempotência.
      type: object
