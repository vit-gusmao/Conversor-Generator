name: Desktop (Windows)

# Pipeline de distribuição do aplicativo Windows. Separado da CI Linux: depende
# de toolchain Windows e de um ambiente Python fixado para o PyInstaller.
#
# A sequência de build vive em scripts/build-desktop.ps1 (a mesma usada
# localmente); este workflow prepara o ambiente, chama o script e valida o
# resultado com scripts/smoke-desktop.ps1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows x64 (backend + electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # build-desktop.ps1 only accepts the venv at services\converter\.venv.
      # Tests run before the OCR extra is installed, so the test environment
      # matches the Linux converter job (no Tesseract binary on this runner).
      - name: Create converter venv (test + migrate + pyinstaller)
        working-directory: services/converter
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[test,migrate]" pyinstaller

      - name: Run converter tests
        working-directory: services/converter
        run: .\.venv\Scripts\python.exe -m pytest tests -q

      - name: Install OCR extra for the frozen bundle
        working-directory: services/converter
        run: .\.venv\Scripts\python.exe -m pip install -e ".[ocr]"

      - name: Desktop unit tests
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build

      # Contracts, SPA, PyInstaller (onedir) with backend smoke, electron-builder
      # NSIS + win-unpacked into apps/desktop/release.
      - name: Build desktop package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop.ps1

      - name: Smoke test packaged app
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-desktop.ps1
          -AppDir apps/desktop/release/win-unpacked -RequireGuard

      - name: Verify executable name and artifacts
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          $exe = Get-ChildItem $release -Recurse -Filter "conversor-generator.exe" | Select-Object -First 1
          if (-not $exe) { throw "conversor-generator.exe ausente" }
          $setup = Get-ChildItem $release -Filter "conversor-generator-setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "instalador ausente" }
          Write-Host "EXE:" $exe.FullName
          Write-Host "SETUP:" $setup.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: conversor-generator-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
